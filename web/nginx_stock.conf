# ============================================================
# 우리거래소를 https://도메인/stock 으로 연결하는 nginx 설정
#
# Let's Encrypt(certbot)가 만들어 둔 "listen 443 ssl" 이 있는
# server { ... } 블록 안쪽에 아래 두 location 을 붙여 넣는다.
#
# 파일 위치는 보통 이 중 하나다:
#   /etc/nginx/sites-available/default
#   /etc/nginx/sites-available/도메인이름
#   /etc/nginx/conf.d/도메인이름.conf
# ============================================================

    # /stock 으로 들어오면 /stock/ 으로 보낸다 (끝 슬래시가 있어야 화면 안의 주소가 맞게 풀린다)
    location = /stock {
        return 301 /stock/;
    }

    # /stock/ 아래는 전부 거래소 서버로 넘긴다.
    # proxy_pass 끝의 "/" 가 /stock 부분을 떼어 준다. 빼먹으면 안 된다.
    location /stock/ {
        proxy_pass http://127.0.0.1:8000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
